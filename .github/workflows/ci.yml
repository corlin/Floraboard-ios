# Floraboard iOS CI Pipeline
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build:
    name: Build & Test
    # 部署目标是 iOS 26.2，需要 Xcode 26.2+（macos-15 只有 Xcode 16）
    runs-on: macos-26
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Floreboard.xcodeproj \
            -scheme Floreboard \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Logic tests
        run: scripts/run_logic_tests.sh
